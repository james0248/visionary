seed: 42
algorithm: ppo_rnd
env: ALE/MontezumaRevenge-v5
n_envs: 128
fire_reset: true

# Preprocessing
frame_skip: 4
screen_size: 84
max_frames_episode: 4500

# Training
total_rollouts_per_env: 30000
rollout_length: 128
n_epochs: 4
n_mini_batch: 4
learning_rate: 1e-4
max_grad_norm: 0.5

ext_gamma: 0.999
int_gamma: 0.99
lambda: 0.95
ext_adv_coeff: 2.0
int_adv_coeff: 1.0
ent_coeff: 0.001
clip_range: 0.1
value_coeff: 0.5
rnd_coeff: 1.0

steps_initial_normalization: 50
predictor_proportion: 0.25

# Checkpointing/logging
checkpoint_interval_rollouts: 100
log_interval_rollouts: 10

# Evaluation
eval_steps: 100_000

# Wandb
wandb:
  enabled: true
  project: visionary
