seed: 42
ema_decay: 0.999
optimizer:
  peak_lr: 3e-4
  warmup_ratio: 0.05
  decay_ratio: 0.1
  weight_decay: 0.1
  muon_beta: 0.95
  ns_steps: 5
  nesterov: true
  adam_lr_ratio: 1.0
  adam_b1: 0.9
  adam_b2: 0.99
log_interval: 100
eval_steps: 1000
total_steps: 1000000
exp_name: ???
tokenizer_exp_name: ???

loss:
  bootstrap_ratio: 0.25
  bootstrap_start_step: 10000

video_eval:
  context_frames: 4
  generated_frames: 60
  sample_steps: 4
  context_tau: 0.9
  fps: 15
  output_dir: artifacts/dynamics_eval/${exp_name}
  tokenizer:
    checkpoint_dir: gs://visionary-uc1/atari/checkpoints/${tokenizer_exp_name}
    checkpoint_step: null

dataset:
  train_dir: data/tokenized/train/
  eval_dir: data/tokenized/eval/
  batch_size: 64
  batch_length: 64
  alternating_lengths:
    enabled: true
    short: 16
    long: 64
    long_every: 8
    final_long_only_steps: 0
  worker_count: 4
  num_threads: 8
  prefetch_buffer_size: 16
  eval:
    batch_length: 64
    max_batches: 16

dynamics:
  _target_: visionary.models.dreamer4.dynamics.DynamicsModel
  num_layers: 24
  num_heads: 8
  num_kv_heads: 2
  temporal_layer_period: 4
  num_registers: 2
  num_obs_tokens: 32
  num_actions: ???
  action_mode: discrete
  max_step_size: 6
  model_dim: 128
  head_dim: 32
  mlp_hidden_dim: 384
  context_length: 32
  base: 10000.0

checkpoint:
  export_interval_steps: 100000
  manager:
    _target_: visionary.common.checkpoint.CheckpointManager
    directory: gs://visionary-uc1/atari/checkpoints/${exp_name}
    options:
      _target_: orbax.checkpoint.CheckpointManagerOptions
      save_interval_steps: 10000
      max_to_keep: 5
      enable_async_checkpointing: true
  resume_step: null

wandb:
  enabled: true
  project: visionary
  group: null
