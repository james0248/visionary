seed: 42
learning_rate: 3e-4
log_interval: 100
eval_steps: 1000
total_steps: 1000000
overfit_single_batch: false
exp_name: ???
tokenizer_exp_name: ???

fsdp:
  enabled: auto
  data_axis_size: 1
  log_sharding: true

loss:
  bootstrap_ratio: 0.25
  bootstrap_start_step: 10000

video_eval:
  context_frames: 16
  generated_frames: 112
  sample_steps: 4
  context_tau: 0.9
  fps: 20
  output_dir: artifacts/dynamics_eval/${exp_name}
  tokenizer:
    checkpoint_dir: gs://visionary-exp/dream-arcade/checkpoints/${tokenizer_exp_name}
    checkpoint_step: null

dataset:
  train_dir: data/tokenized/train/
  eval_dir: data/tokenized/eval/
  batch_size: 64
  batch_length: 128
  alternating_lengths:
    enabled: true
    short: 32
    long: 128
    long_every: 8
    final_long_only_steps: 0
  worker_count: 4
  num_threads: 8
  prefetch_buffer_size: 16
  eval:
    batch_length: 128
    max_batches: 16

dynamics:
  _target_: visionary.dynamics.DynamicsModel
  num_layers: 24
  num_heads: 8
  num_kv_heads: 2
  num_registers: 2
  num_obs_tokens: 32
  num_actions: ???
  max_step_size: 6
  model_dim: 128
  head_dim: 32
  mlp_hidden_dim: 384
  context_length: 64
  temporal_layer_period: 2
  base: 10000.0

checkpoint:
  export_interval_steps: 50000
  manager:
    _target_: visionary.common.checkpoint.CheckpointManager
    directory: gs://visionary-exp/dream-arcade/checkpoints/${exp_name}
    options:
      _target_: orbax.checkpoint.CheckpointManagerOptions
      save_interval_steps: 10000
      max_to_keep: 5
      enable_async_checkpointing: true
  resume_step: null

wandb:
  enabled: true
  project: visionary
  group: null
