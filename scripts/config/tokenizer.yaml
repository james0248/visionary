seed: 42
learning_rate: 3e-4
optimizer:
  _target_: optax.adam
  learning_rate: ${learning_rate}
lpips_weight: 0.4
sigreg_weight: 0.09
log_interval: 100
eval_steps: 1000
total_steps: 1000000
exp_name: ???

fsdp:
  enabled: auto
  data_axis_size: 8
  log_sharding: true

dataset:
  train_dir: /mnt/data/train/
  eval_dir: /mnt/data/eval/
  # VideoDataSource reads decoded frames; VideoBytesDataSource reads encoded mp4
  # and pairs with DecodeRandomVideoClip below.
  source:
    _target_: visionary.dataset.VideoDataSource
  clip_transform:
    _target_: visionary.dataset.RandomVideoCrop
  augment: null
  frame_length: 32
  batch_size: 8
  worker_count: 4
  num_threads: 8
  prefetch_buffer_size: 16
  eval:
    max_batches: 16
    log_frames: 8

tokenizer:
  _target_: visionary.models.dreamer4.tokenizer.Tokenizer
  num_layers: 8
  num_latents: 64
  num_heads: 8
  num_kv_heads: 2
  temporal_layer_period: 4
  model_dim: 128
  mlp_hidden_dim: 384
  head_dim: 32
  channel_dim: 16
  resize_shape: [128, 96]
  pad_width: [0, 0]
  patch_size: 8
  base: 10000.0
  independent_prob: 0.3

checkpoint:
  export_interval_steps: 100000
  manager:
    _target_: visionary.common.checkpoint.CheckpointManager
    directory: gs://visionary-uc1/atari/checkpoints/${exp_name}
    options:
      _target_: orbax.checkpoint.CheckpointManagerOptions
      save_interval_steps: 10000
      max_to_keep: 5
      enable_async_checkpointing: true
  resume_step: null

wandb:
  enabled: true
  project: visionary
  group: null
