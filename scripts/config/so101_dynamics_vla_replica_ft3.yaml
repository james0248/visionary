seed: 42
ema_decay: 0.99
optimizer:
  peak_lr: 1e-5
  warmup_ratio: 0.05
  decay_ratio: 0.2
  weight_decay: 0.1
  muon_beta: 0.95
  ns_steps: 5
  nesterov: true
  adam_lr_ratio: 1.0
  adam_b1: 0.9
  adam_b2: 0.99
loss:
  bootstrap_ratio: 0.25
  bootstrap_start_step: 0
log_interval: 10
eval_steps: 25
total_steps: 200
exp_name: dynamics_v4_312m_ramp_vla_replica_ft3_seed42
tokenizer_exp_name: tokenizer_v2

initialization:
  directory: gs://visionary-uc1/so101/checkpoints/dynamics_v4_312m_ramp
  step: 100000

dataset:
  latent_stats: data/so101/dynamics/latent_stats.json
  sources:
    - embodiment: so101_absolute_joint_6d_v1
      train_dir: data/vla_replica_finetune/train
      eval_dir: data/vla_replica_finetune/validation
      action_dim: 6
      sampling_weight: 1.0
  batch_size: 16
  pack_length: 128
  worker_count: 8
  num_threads: 8
  prefetch_buffer_size: 16
  eval:
    max_batches: 16

dynamics:
  _target_: visionary.models.dreamer4.dynamics.DynamicsModel
  num_layers: 12
  num_heads: 18
  num_kv_heads: 6
  model_dim: 1536
  mlp_hidden_dim: 4608
  head_dim: 64
  num_registers: 2
  num_obs_tokens: 256
  num_actions: 6
  num_embodiments: 2
  max_action_dim: 7
  action_mode: continuous
  max_step_size: 8
  context_length: 48
  temporal_layer_period: 3
  base: 10000.0
  remat_policy: null

video_eval:
  context_frames: 4
  horizon: 32
  num_samples: 4
  seed: 42
  sample_steps: 4
  context_tau: 0.9
  fps: 5
  output_dir: artifacts/dynamics_eval/${exp_name}
  tokenizer:
    checkpoint_dir: gs://visionary-uc1/so101/checkpoints/${tokenizer_exp_name}
    checkpoint_step: 100000

checkpoint:
  export_interval_steps: 25
  manager:
    _target_: visionary.common.checkpoint.CheckpointManager
    directory: gs://visionary-uc1/so101/checkpoints/${exp_name}
    options:
      _target_: orbax.checkpoint.CheckpointManagerOptions
      save_interval_steps: 25
      max_to_keep: 9
      keep_period: 200
      enable_async_checkpointing: true
  resume_step: null

wandb:
  enabled: true
  project: visionary
  group: ${exp_name}
