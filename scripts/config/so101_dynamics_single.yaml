seed: 42
learning_rate: 1e-4
optimizer:
  _target_: optax.chain
  _args_:
    - _target_: optax.clip_by_global_norm
      max_norm: 1.0
    - _target_: optax.adam
      learning_rate:
        _target_: optax.linear_schedule
        init_value: ${learning_rate}
        end_value: 1e-5
        transition_steps: 20000
        transition_begin: 2230000
log_interval: 100
eval_steps: 1000
# 100k steps past the 2.15M ftg5 checkpoint, on a single repo's records
total_steps: 2250000
overfit_single_batch: false
exp_name: dynamics_single
tokenizer_exp_name: tokenizer

fsdp:
  enabled: auto
  data_axis_size: 8
  log_sharding: true

loss:
  bootstrap_ratio: 0.25
  bootstrap_start_step: 25000

video_eval:
  context_frames: 4
  generated_frames: 30
  sample_steps: 4
  context_tau: 0.9
  fps: 8
  output_dir: artifacts/dynamics_eval/${exp_name}
  tokenizer:
    checkpoint_dir: gs://visionary-uc1/so101/checkpoints/${tokenizer_exp_name}
    checkpoint_step: null

dataset:
  # single-repo (Loki0929/so100_lan) subset of the g5-filtered latents:
  # the capacity-vs-coverage overfit probe
  train_dir: data/so101/dyn_single/train
  eval_dir: data/so101/dyn_single/eval
  # every fourth frame, 7.5Hz effective
  stride: 4
  batch_size: 32
  batch_length: 32
  alternating_lengths:
    enabled: true
    short: 8
    # past context_length, so the truncated sliding window is trained too
    long: 32
    long_every: 8
    final_long_only_steps: 0
  worker_count: 8
  num_threads: 8
  prefetch_buffer_size: 16
  eval:
    batch_length: 34
    # the held-out split is only 26 records
    max_batches: 4

dynamics:
  _target_: visionary.dynamics.DynamicsModel
  # 138M, near tokenizer parity
  num_layers: 12
  num_heads: 12
  num_kv_heads: 3
  temporal_layer_period: 4
  num_registers: 2
  num_obs_tokens: 160
  num_actions: 6
  action_mode: continuous
  max_step_size: 6
  model_dim: 1024
  head_dim: 64
  mlp_hidden_dim: 3072
  # 3.2s at 7.5Hz, same wall-clock context as the 651M/30fps run
  context_length: 24
  base: 10000.0
  remat: false
  remat_policy: null

checkpoint:
  export_interval_steps: 100000
  manager:
    _target_: visionary.common.checkpoint.CheckpointManager
    directory: gs://visionary-uc1/so101/checkpoints/${exp_name}
    options:
      _target_: orbax.checkpoint.CheckpointManagerOptions
      # short run; no need for the 1000-step churn
      save_interval_steps: 5000
      max_to_keep: 5
      enable_async_checkpointing: true
  resume_step: null

wandb:
  enabled: true
  project: visionary
  group: so101_dynamics_single
