seed: 42
learning_rate: 3e-4
optimizer:
  _target_: optax.chain
  _args_:
    - _target_: optax.clip_by_global_norm
      max_norm: 1.0
    - _target_: optax.adam
      learning_rate:
        _target_: optax.warmup_constant_schedule
        init_value: 0.0
        peak_value: ${learning_rate}
        warmup_steps: 1000
log_interval: 100
eval_steps: 1000
total_steps: 200000
overfit_single_batch: false
exp_name: so101_dynamics
tokenizer_exp_name: so101_tokenizer

fsdp:
  enabled: auto
  data_axis_size: 8
  log_sharding: true

loss:
  bootstrap_ratio: 0.25
  bootstrap_start_step: 25000

video_eval:
  context_frames: 4
  generated_frames: 60
  sample_steps: 4
  context_tau: 0.9
  fps: 30
  output_dir: artifacts/dynamics_eval/${exp_name}
  tokenizer:
    checkpoint_dir: gs://visionary-robot-bucket/so101/checkpoints/${tokenizer_exp_name}
    checkpoint_step: null

dataset:
  train_dir: data/so101/dyn/train
  eval_dir: data/so101/dyn/eval
  batch_size: 16
  # inert while alternating_lengths is enabled; kept equal to long
  batch_length: 128
  alternating_lengths:
    enabled: true
    short: 32
    # past context_length, so the truncated sliding window is trained too
    long: 128
    long_every: 8
    final_long_only_steps: 0
  worker_count: 8
  num_threads: 8
  prefetch_buffer_size: 16
  eval:
    batch_length: 128
    max_batches: 16

dynamics:
  _target_: visionary.dynamics.DynamicsModel
  # 651M, 4x the tokenizer; Atari keeps them near parity but Dreamer 4 makes
  # the dynamics model much larger than the tokenizer
  num_layers: 24
  num_heads: 24
  num_kv_heads: 6
  temporal_layer_period: 4
  num_registers: 2
  # one dynamics token per tokenizer latent, so no packing
  num_obs_tokens: 160
  # unused when action_mode is continuous, but the field is required
  num_actions: 6
  action_mode: continuous
  max_step_size: 6
  model_dim: 1536
  head_dim: 64
  mlp_hidden_dim: 4608
  # Dreamer 4 uses 96 frames of context for its real-world robot datasets
  context_length: 96
  base: 10000.0
  # params + adam are replicated (~10.4 GB/chip fp32) and saving the matmuls
  # costs ~14 GB per sequence at the 128-frame long batches, so at 2 seqs/chip
  # everything is recomputed: ~2 GB/seq of activations for 1.25x flops
  remat: true
  remat_policy: nothing_saveable

checkpoint:
  export_interval_steps: 100000
  manager:
    _target_: visionary.common.checkpoint.CheckpointManager
    directory: gs://visionary-robot-bucket/so101/checkpoints/${exp_name}
    options:
      _target_: orbax.checkpoint.CheckpointManagerOptions
      # spot preemption is frequent, so bound the work a restart can lose
      save_interval_steps: 2000
      max_to_keep: 5
      enable_async_checkpointing: true
  resume_step: null

wandb:
  enabled: true
  project: visionary
  group: so101_dynamics
