seed: 42
optimizer:
  peak_lr: 3e-3
  warmup_ratio: 0.01
  decay_ratio: 0.8
  weight_decay: 0.1
  muon_beta: 0.95
  ns_steps: 5
  nesterov: true
  adam_lr_ratio: 1.0
  adam_b1: 0.9
  adam_b2: 0.99
lpips_weight: 0.2
lpips_frame_stride: 2
log_interval: 100
eval_steps: 1000
total_steps: 100000
exp_name: tokenizer_v2

fsdp:
  enabled: auto
  data_axis_size: 16
  log_sharding: true

dataset:
  train_dir: data/so101/shards/train
  eval_dir: data/so101/shards/eval
  source:
    _target_: visionary.dataset.WeightedVideoBytesDataSource
  clip_transform:
    _target_: visionary.dataset.DecodeRandomVideoClip
    target_hz: 5.0
  augment:
    _target_: visionary.dataset.AugmentVideoClip
    crop_scale: 0.95
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
  frame_length: 16
  batch_size: 32
  worker_count: 8
  num_threads: 8
  prefetch_buffer_size: 16
  eval:
    max_batches: 16
    log_frames: 8

tokenizer:
  _target_: visionary.models.dreamer4.tokenizer.Tokenizer
  num_layers: 12
  num_latents: 256
  num_heads: 12
  num_kv_heads: 3
  temporal_layer_period: 4
  temporal_layer_offset: 1
  model_dim: 768
  mlp_hidden_dim: 2304
  head_dim: 64
  decoder_num_layers: 8
  channel_dim: 16
  resize_shape: [240, 320]
  pad_width: [0, 0]
  patch_size: 16
  base: 10000.0
  remat: true
  remat_policy: dots_with_no_batch_dims_saveable
  independent_prob: 0.2

checkpoint:
  export_interval_steps: 25000
  manager:
    _target_: visionary.common.checkpoint.CheckpointManager
    directory: gs://visionary-uc1/so101/checkpoints/${exp_name}
    options:
      _target_: orbax.checkpoint.CheckpointManagerOptions
      save_interval_steps: 1000
      max_to_keep: 5
      enable_async_checkpointing: true
  resume_step: null

wandb:
  enabled: true
  project: visionary
  group: so101_tokenizer_v2
