[project]
name = "visionary"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ale-py>=0.11.2",
    "array-record>=0.8.3",
    "av>=12.0.0",
    "einops>=0.8.2",
    "flax>=0.12.5",
    "gcsfs>=2026.3.0",
    "grain>=0.2.16",
    "gymnasium>=1.2.3",
    "huggingface-hub>=0.24.0",
    "hydra-core>=1.3.2",
    "importlib-resources>=6.5.2",
    "jax>=0.10.2",
    "jaxlpips>=1.2.0",
    "moviepy>=2.2.1",
    "opencv-python-headless>=4.10.0.84",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.11.33",
    "pyarrow>=15.0.0",
    "scikit-image>=0.26.0",
    "wandb>=0.19.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visionary"]

[dependency-groups]
dev = ["ruff>=0.15.6"]
onnx = [
    "jax2onnx==0.13.0",
    "onnx==1.21.0",
    "onnx-simplifier==0.4.36",
    "onnxruntime==1.25.0",
]

[tool.ruff]
line-length = 120
