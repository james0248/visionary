<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Pacman WebGPU Validation</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="machine" aria-label="Pacman WebGPU frame output">
        <div class="marquee">
          <span>Pacman</span>
          <strong>Pacman frame output</strong>
          <div id="fps" class="meter">-- fps</div>
        </div>
        <div class="stage">
          <div class="screen-bezel">
            <canvas id="frame" width="96" height="128" aria-label="Generated Pacman frame"></canvas>
          </div>
        </div>
      </section>
      <aside class="panel">
        <div class="topline">
          <h1>Pacman validation</h1>
          <p id="status">Loading assets</p>
        </div>

        <div class="control-deck">
          <div class="controls">
            <button id="start" type="button">Start</button>
            <button id="reset" type="button">Reset</button>
          </div>

          <div class="action-grid pacman-grid" aria-label="Action controls">
            <button class="key-button" type="button" data-action-id="6">↖</button>
            <button id="key-up" class="key-button" type="button" data-action-id="1">↑</button>
            <button class="key-button" type="button" data-action-id="5">↗</button>
            <button id="key-left" class="key-button" type="button" data-action-id="3">←</button>
            <button id="key-noop" class="key-button" type="button" data-action-id="0">•</button>
            <button id="key-right" class="key-button" type="button" data-action-id="2">→</button>
            <button class="key-button" type="button" data-action-id="8">↙</button>
            <button id="key-down" class="key-button" type="button" data-action-id="4">↓</button>
            <button class="key-button" type="button" data-action-id="7">↘</button>
          </div>
        </div>

        <dl class="stats">
          <div>
            <dt>Backend</dt>
            <dd id="backend">--</dd>
          </div>
          <div>
            <dt>Action</dt>
            <dd id="action">noop</dd>
          </div>
          <div>
            <dt>Frame</dt>
            <dd id="frame-count">0</dd>
          </div>
          <div>
            <dt>Last frame</dt>
            <dd id="latency">-- ms</dd>
          </div>
          <div>
            <dt>Target</dt>
            <dd>
              <select id="target-fps" aria-label="Target FPS">
                <option value="0" selected>Max</option>
                <option value="15">15 fps</option>
                <option value="20">20 fps</option>
                <option value="30">30 fps</option>
                <option value="60">60 fps</option>
              </select>
            </dd>
          </div>
          <div>
            <dt>Payload</dt>
            <dd id="payload">--</dd>
          </div>
          <div>
            <dt>Context</dt>
            <dd id="context">episode_0 @ 4</dd>
          </div>
        </dl>

        <div class="loadout" aria-label="Loading progress">
          <div class="loadbar">
            <div id="load-progress-fill"></div>
          </div>
          <p id="load-progress-text">Waiting</p>
          <ol id="load-log"></ol>
        </div>
      </aside>
    </main>
    <script>
      window.VISIONARY_DEMO_CONFIG = {
        assetBase: '/dream_arcade_assets/pacman',
        manifestName: 'breakout_onnx_manifest.json',
        contextName: 'pacman_demo_context.json',
        initialCacheName: 'pacman_demo_initial_cache.json',
        actions: [
          { id: 0, name: 'noop', label: 'noop', keys: [] },
          { id: 1, name: 'up', label: 'up', keys: [['ArrowUp'], ['KeyW']] },
          { id: 2, name: 'right', label: 'right', keys: [['ArrowRight'], ['KeyD']] },
          { id: 3, name: 'left', label: 'left', keys: [['ArrowLeft'], ['KeyA']] },
          { id: 4, name: 'down', label: 'down', keys: [['ArrowDown'], ['KeyS']] },
          {
            id: 5,
            name: 'upRight',
            label: 'up+right',
            keys: [
              ['ArrowUp', 'ArrowRight'],
              ['KeyW', 'KeyD'],
            ],
          },
          {
            id: 6,
            name: 'upLeft',
            label: 'up+left',
            keys: [
              ['ArrowUp', 'ArrowLeft'],
              ['KeyW', 'KeyA'],
            ],
          },
          {
            id: 7,
            name: 'downRight',
            label: 'down+right',
            keys: [
              ['ArrowDown', 'ArrowRight'],
              ['KeyS', 'KeyD'],
            ],
          },
          {
            id: 8,
            name: 'downLeft',
            label: 'down+left',
            keys: [
              ['ArrowDown', 'ArrowLeft'],
              ['KeyS', 'KeyA'],
            ],
          },
        ],
      };
    </script>
    <script
      id="visionary-demo-main"
      type="module"
      src="./main.js"
      data-asset-base="/dream_arcade_assets/pacman"
      data-manifest-name="breakout_onnx_manifest.json"
      data-context-name="pacman_demo_context.json"
      data-initial-cache-name="pacman_demo_initial_cache.json"
      data-ort-module="/node_modules/onnxruntime-web/dist/ort.webgpu.bundle.min.mjs"
      data-ort-wasm-base="/node_modules/onnxruntime-web/dist/"
    ></script>
  </body>
</html>
