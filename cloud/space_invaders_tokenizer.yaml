project: visionary-491008
exp_name: space_invaders_tokenizer_small_2x
checkpoint_dir: gs://dream-atari-bucket/dream-arcade/checkpoints/${exp_name}

job:
  name: space-invaders-tokenizer
  poll_interval_seconds: 60
  queue_wait_timeout_seconds: 0
  spot: true

repo:
  url: https://github.com/james0248/visionary.git
  branch: main

setup:
  accelerator: tpu

training:
  script: scripts/train_tokenizer.py
  config_name: tokenizer
  auto_resume: true
  overrides:
    - exp_name=${exp_name}
    - dataset.train_dir=/mnt/data/space_invaders_tokenizer/train
    - dataset.eval_dir=/mnt/data/space_invaders_tokenizer/eval
    - checkpoint.manager.directory=${checkpoint_dir}
    - wandb.group=space_invaders_tokenizer

markers:
  complete_uri: ${checkpoint_dir}/_training_complete.json
  failure_prefix: ${checkpoint_dir}/failures

logs:
  uri: ${checkpoint_dir}/_starter.log
  archive_uri_prefix: ${checkpoint_dir}/logs
  tail_lines: 120

failure_policy:
  mode: retry
  max_retries: 3
  retry_backoff_seconds: 30

secrets:
  wandb_secret: wandb-api-key

starter_service_account:
  email: visionary-starter@visionary-491008.iam.gserviceaccount.com
  scopes:
    - https://www.googleapis.com/auth/cloud-platform

watcher:
  impersonate_service_account: visionary-watcher@visionary-491008.iam.gserviceaccount.com
  state_uri: ${checkpoint_dir}/_watcher_state.json
  gcloud_retry_attempts: 5
  gcloud_retry_backoff_seconds: 5
  gcloud_retry_max_backoff_seconds: 60

machine:
  family: v6e
  chips: 8
  zone: asia-southeast1-b
  spot: true
  data_disk:
    source: projects/visionary-491008/zones/asia-southeast1-b/disks/visionary-tokenizer-data-ase1b
    mode: read-only
    mount_path: /mnt/data
