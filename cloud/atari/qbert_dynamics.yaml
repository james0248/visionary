project: visionary-491008
exp_name: qbert_dynamics_skipframe
tokenizer_exp_name: qbert_tokenizer_skipframe
checkpoint_dir: gs://visionary-uc1/atari/checkpoints/${exp_name}

job:
  name: qbert-dynamics
  poll_interval_seconds: 60
  queue_wait_timeout_seconds: 0
  spot: true

repo:
  url: https://github.com/james0248/visionary.git
  branch: main

setup:
  accelerator: tpu

training:
  script: scripts/train_dynamics.py
  config_name: dynamics
  auto_resume: true
  overrides:
    - exp_name=${exp_name}
    - tokenizer_exp_name=${tokenizer_exp_name}
    - video_eval.tokenizer.checkpoint_dir=gs://visionary-uc1/atari/checkpoints/${tokenizer_exp_name}
    - dataset.sources.0.train_dir=/mnt/data/qbert_dynamics/train
    - dataset.sources.0.eval_dir=/mnt/data/qbert_dynamics/eval
    - dynamics.num_actions=6
    - checkpoint.manager.directory=${checkpoint_dir}
    - total_steps=1000000
    - wandb.group=qbert_dynamics_skipframe

markers:
  complete_uri: ${checkpoint_dir}/_training_complete.json
  failure_prefix: ${checkpoint_dir}/failures

logs:
  uri: ${checkpoint_dir}/_starter.log
  archive_uri_prefix: ${checkpoint_dir}/logs
  tail_lines: 120

failure_policy:
  mode: retry
  max_retries: 3
  retry_backoff_seconds: 30

secrets:
  wandb_secret: wandb-api-key

starter_service_account:
  email: visionary-starter@visionary-491008.iam.gserviceaccount.com
  scopes:
    - https://www.googleapis.com/auth/cloud-platform

watcher:
  impersonate_service_account: visionary-watcher@visionary-491008.iam.gserviceaccount.com
  state_uri: ${checkpoint_dir}/_watcher_state.json
  gcloud_retry_attempts: 5
  gcloud_retry_backoff_seconds: 5
  gcloud_retry_max_backoff_seconds: 60

machine:
  family: v6e
  chips: 8
  zone: us-central1-b
  spot: true
  data_disk:
    source: projects/visionary-491008/zones/us-central1-b/disks/visionary-dynamics-data-uc1b
    mode: read-only
    mount_path: /mnt/data
