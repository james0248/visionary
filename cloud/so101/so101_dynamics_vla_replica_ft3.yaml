project: visionary-491008
exp_name: dynamics_v4_312m_ramp_vla_replica_ft3_seed42
checkpoint_dir: gs://visionary-uc1/so101/checkpoints/${exp_name}
data_dir: gs://visionary-uc1/so101/data/dynamics/vla_replica_ft3_seed42

job:
  name: so101-vla-replica-ft3-seed42
  poll_interval_seconds: 30
  queue_wait_timeout_seconds: 0
  spot: true

repo:
  url: https://github.com/james0248/visionary.git
  branch: codex/vla-replica-ft-3-per-task

setup:
  accelerator: tpu

training:
  script: scripts/train_dynamics.py
  config_name: so101_dynamics_vla_replica_ft3
  auto_resume: true
  overrides:
    - dataset.latent_stats=gs://visionary-uc1/so101/data/dynamics/latent_stats.json
    - dataset.sources.0.train_dir=${data_dir}/train
    - dataset.sources.0.eval_dir=${data_dir}/validation
    - checkpoint.manager.directory=${checkpoint_dir}
    - checkpoint.resume_step=latest

markers:
  complete_uri: ${checkpoint_dir}/_training_complete.json
  failure_prefix: ${checkpoint_dir}/failures

logs:
  uri: ${checkpoint_dir}/_starter.log
  archive_uri_prefix: ${checkpoint_dir}/logs
  tail_lines: 180

failure_policy:
  mode: retry
  max_retries: 2
  retry_backoff_seconds: 30

secrets:
  wandb_secret: wandb-api-key

starter_service_account:
  email: visionary-starter@visionary-491008.iam.gserviceaccount.com
  scopes:
    - https://www.googleapis.com/auth/cloud-platform

watcher:
  impersonate_service_account: visionary-watcher@visionary-491008.iam.gserviceaccount.com
  state_uri: ${checkpoint_dir}/_watcher_state.json
  gcloud_retry_attempts: 5
  gcloud_retry_backoff_seconds: 5
  gcloud_retry_max_backoff_seconds: 60

machine:
  family: v6e
  chips: 16
  zone: us-central1-b
  spot: true
  valid_until_duration: 3000s
