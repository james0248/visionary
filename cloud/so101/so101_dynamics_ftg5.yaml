# Fine-tune the 138M strided model from 1.5M on the g5-filtered latents.
project: visionary-491008
exp_name: dynamics_small_ft
tokenizer_exp_name: tokenizer
# Single-region, co-located with the TPU zone: same-region writes are not
# billed as multi-region replication, which was ~76% of this run's GCS cost.
bucket: gs://visionary-uc1
checkpoint_dir: ${bucket}/so101/checkpoints/${exp_name}

job:
  name: so101-dyn-ftg5
  poll_interval_seconds: 60
  queue_wait_timeout_seconds: 0
  spot: true

repo:
  url: https://github.com/james0248/visionary.git
  branch: so101

setup:
  accelerator: tpu

training:
  script: scripts/train_dynamics.py
  config_name: so101_dynamics_small_ftg5
  auto_resume: true
  overrides:
    - exp_name=${exp_name}
    - tokenizer_exp_name=${tokenizer_exp_name}
    - dataset.train_dir=/mnt/data/dynamics_filtered/train
    - dataset.eval_dir=/mnt/data/dynamics_filtered/eval
    - checkpoint.manager.directory=${checkpoint_dir}
    # Overridden here rather than in scripts/config, so the running job picks
    # up the new bucket without needing a push to the so101 branch.
    - video_eval.tokenizer.checkpoint_dir=${bucket}/so101/checkpoints/${tokenizer_exp_name}

markers:
  complete_uri: ${checkpoint_dir}/_training_complete.json
  failure_prefix: ${checkpoint_dir}/failures

logs:
  uri: ${checkpoint_dir}/_starter.log
  archive_uri_prefix: ${checkpoint_dir}/logs
  tail_lines: 120

failure_policy:
  mode: retry
  max_retries: 3
  retry_backoff_seconds: 30

secrets:
  wandb_secret: wandb-api-key

starter_service_account:
  email: visionary-starter@visionary-491008.iam.gserviceaccount.com
  scopes:
    - https://www.googleapis.com/auth/cloud-platform

watcher:
  impersonate_service_account: visionary-watcher@visionary-491008.iam.gserviceaccount.com
  state_uri: ${checkpoint_dir}/_watcher_state.json
  gcloud_retry_attempts: 5
  gcloud_retry_backoff_seconds: 5
  gcloud_retry_max_backoff_seconds: 60

machine:
  family: v6e
  chips: 8
  zone: us-central1-b
  spot: true
  data_disk:
    source: projects/visionary-491008/zones/us-central1-b/disks/visionary-so101-dyng5-uc1b
    mode: read-only
    mount_path: /mnt/data
