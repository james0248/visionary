# v5e-4 fallback for the small run while the v6e queue is dry. Same
# checkpoint dir -- only one of the two may run at a time.
project: visionary-491008
exp_name: dynamics_small
tokenizer_exp_name: tokenizer
checkpoint_dir: gs://visionary-uc1/so101/checkpoints/${exp_name}
ops_dir: gs://visionary-uc1/so101/checkpoints/${exp_name}/v5e

job:
  name: so101-dyn-small-v5e
  poll_interval_seconds: 60
  queue_wait_timeout_seconds: 0
  spot: true

repo:
  url: https://github.com/james0248/visionary.git
  branch: so101

setup:
  accelerator: tpu

training:
  script: scripts/train_dynamics.py
  config_name: so101_dynamics_small
  auto_resume: true
  overrides:
    - exp_name=${exp_name}
    - tokenizer_exp_name=${tokenizer_exp_name}
    - dataset.train_dir=/mnt/data/dynamics/train
    - dataset.eval_dir=/mnt/data/dynamics/eval
    - checkpoint.manager.directory=${checkpoint_dir}
    - fsdp.data_axis_size=4
    - dynamics.remat=true
    - dynamics.remat_policy=nothing_saveable

markers:
  complete_uri: ${checkpoint_dir}/_training_complete.json
  failure_prefix: ${ops_dir}/failures

logs:
  uri: ${ops_dir}/_starter.log
  archive_uri_prefix: ${ops_dir}/logs
  tail_lines: 120

failure_policy:
  mode: retry
  max_retries: 3
  retry_backoff_seconds: 30

secrets:
  wandb_secret: wandb-api-key

starter_service_account:
  email: visionary-starter@visionary-491008.iam.gserviceaccount.com
  scopes:
    - https://www.googleapis.com/auth/cloud-platform

watcher:
  impersonate_service_account: visionary-watcher@visionary-491008.iam.gserviceaccount.com
  state_uri: ${ops_dir}/_watcher_state.json
  gcloud_retry_attempts: 5
  gcloud_retry_backoff_seconds: 5
  gcloud_retry_max_backoff_seconds: 60

machine:
  family: v5e
  chips: 4
  zone: us-west1-c
  spot: true
  data_disk:
    source: projects/visionary-491008/zones/us-west1-c/disks/so101-dyn-data-uw1c
    mode: read-only
    mount_path: /mnt/data
