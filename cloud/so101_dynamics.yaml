# SO-101 dynamics training (TPU v6e-8), continuous 6-DoF actions. Needs the
# so101_tokenizer checkpoint and dynamics ArrayRecords at /mnt/data/so101_dynamics.
project: visionary-491008
exp_name: so101_dynamics
tokenizer_exp_name: so101_tokenizer
checkpoint_dir: gs://visionary-robot-bucket/so101/checkpoints/${exp_name}

job:
  name: so101-dynamics
  poll_interval_seconds: 60
  queue_wait_timeout_seconds: 0
  spot: true

repo:
  url: https://github.com/james0248/visionary.git
  branch: so101

setup:
  accelerator: tpu

training:
  script: scripts/train_dynamics.py
  config_name: so101_dynamics
  auto_resume: true
  # only what differs from the config: paths on the mounted disk, and the names
  # this file already owns because the markers and watcher key off them.
  overrides:
    - exp_name=${exp_name}
    - tokenizer_exp_name=${tokenizer_exp_name}
    - dataset.train_dir=/mnt/data/so101_dynamics/train
    - dataset.eval_dir=/mnt/data/so101_dynamics/eval
    - checkpoint.manager.directory=${checkpoint_dir}

markers:
  complete_uri: ${checkpoint_dir}/_training_complete.json
  failure_prefix: ${checkpoint_dir}/failures

logs:
  uri: ${checkpoint_dir}/_starter.log
  archive_uri_prefix: ${checkpoint_dir}/logs
  tail_lines: 120

failure_policy:
  mode: retry
  max_retries: 3
  retry_backoff_seconds: 30

secrets:
  wandb_secret: wandb-api-key

starter_service_account:
  email: visionary-starter@visionary-491008.iam.gserviceaccount.com
  scopes:
    - https://www.googleapis.com/auth/cloud-platform

watcher:
  impersonate_service_account: visionary-watcher@visionary-491008.iam.gserviceaccount.com
  state_uri: ${checkpoint_dir}/_watcher_state.json
  gcloud_retry_attempts: 5
  gcloud_retry_backoff_seconds: 5
  gcloud_retry_max_backoff_seconds: 60

machine:
  family: v6e
  chips: 8
  zone: us-central1-b
  spot: true
  data_disk:
    source: projects/visionary-491008/zones/us-central1-b/disks/visionary-so101-dynamics-data-uc1b
    mode: read-only
    mount_path: /mnt/data
