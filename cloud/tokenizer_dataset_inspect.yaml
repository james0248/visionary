project: visionary-491008
exp_name: tokenizer_dataset_inspect
checkpoint_dir: gs://visionary-exp/dream-arcade/checkpoints/${exp_name}

job:
  name: tokenizer-dataset-inspect
  poll_interval_seconds: 60
  queue_wait_timeout_seconds: 0
  spot: true

repo:
  url: https://github.com/james0248/visionary.git
  branch: fix/broken-arrayrecord

setup:
  accelerator: cpu

training:
  script: scripts/data/validate_arrayrecord_npz.py
  auto_resume: false
  overrides:
    - /mnt/data/enduro_tokenizer/train
    - /mnt/data/enduro_tokenizer/eval
    - /mnt/data/qbert_tokenizer/train
    - /mnt/data/qbert_tokenizer/eval
    - /mnt/data/seaquest_tokenizer/train
    - /mnt/data/seaquest_tokenizer/eval
    - --keys
    - frames
    - --report_path
    - ${checkpoint_dir}/inspection_report.json
    - --success_on_corruption

markers:
  complete_uri: ${checkpoint_dir}/_inspection_complete.json
  failure_prefix: ${checkpoint_dir}/failures

logs:
  uri: ${checkpoint_dir}/_starter.log
  archive_uri_prefix: ${checkpoint_dir}/logs
  tail_lines: 200

failure_policy:
  mode: stop
  max_retries: 0
  retry_backoff_seconds: 30

starter_service_account:
  email: visionary-starter@visionary-491008.iam.gserviceaccount.com
  scopes:
    - https://www.googleapis.com/auth/cloud-platform

watcher:
  impersonate_service_account: visionary-watcher@visionary-491008.iam.gserviceaccount.com
  state_uri: ${checkpoint_dir}/_watcher_state.json
  gcloud_retry_attempts: 5
  gcloud_retry_backoff_seconds: 5
  gcloud_retry_max_backoff_seconds: 60

machine:
  family: v6e
  chips: 1
  region: us-east1
  spot: true
  data_disk:
    source: projects/visionary-491008/zones/us-east1-d/disks/visionary-data-tokenizer-ue1d
    mode: read-only
    mount_path: /mnt/data
